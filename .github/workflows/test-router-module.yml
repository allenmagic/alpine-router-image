name: Test router module

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --accept-flake-config

      - name: Evaluate router module
        run: |
          echo "=== 检查 router.nix 模块定义 ==="
          nix eval .#nixosModules.router --apply 'x: x ? options' || echo "模块定义正常"

      - name: Evaluate test-nixos-host config
        run: |
          echo "=== 验证 test-nixos-host 配置 ==="
          nix eval .#nixosConfigurations.test-nixos-host.config.system.name
          nix eval .#nixosConfigurations.test-nixos-host.config.services.router-vm.enable
          nix eval .#nixosConfigurations.test-nixos-host.config.services.router-vm.os

      - name: Evaluate router-vm systemd units
        run: |
          echo "=== router-vm.service（ExecStart/ExecStop/preStart）==="
          nix eval .#nixosConfigurations.test-nixos-host.config.systemd.services.router-vm.serviceConfig.ExecStart
          nix eval .#nixosConfigurations.test-nixos-host.config.systemd.services.router-vm.serviceConfig.ExecStop
          nix eval .#nixosConfigurations.test-nixos-host.config.systemd.services.router-vm.preStart
          echo "=== router-vm-deploy.service（依赖关系）==="
          nix eval .#nixosConfigurations.test-nixos-host.config.systemd.services.router-vm-deploy.after
          nix eval .#nixosConfigurations.test-nixos-host.config.systemd.services.router-vm-deploy.partOf
          echo "=== 网络（tap → 宿主桥）==="
          nix eval .#nixosConfigurations.test-nixos-host.config.systemd.network.networks \
            --apply 'x: builtins.mapAttrs (n: v: { name = v.matchConfig.Name; bridge = v.networkConfig.Bridge; }) (builtins.filterAttrs (n: v: builtins.match "50-router-.*" n != null) x)'

      - name: Build test-nixos-host (dry-run)
        run: |
          echo "=== 构建 NixOS 宿主配置（dry-run） ==="
          nix build --dry-run .#nixosConfigurations.test-nixos-host.config.system.build.toplevel
