name: microvm-router-build

# 手动触发：构建 Alpine rootfs（移植自 nanopi-r3s-rootfs，单一发行版链）
# + 装配可启动 VM 镜像（Alpine 官方 virt 三件套）→ 上传 release asset
#
# 产物（tag: alpine-router-image-YYYYMMDD）：
#   alpine-router-rootfs.qcow2  VM 根磁盘（ext4 内含 rootfs + modloop 模块）
#   vmlinuz-virt / initrd       客户机内核与 initramfs（注入 ext4 依赖链）
#   SHA256SUMS                  qnap-nixos-nas 的 fetchurl sha256 来源
#
# 注：不使用 CI secrets 注入密钥——密钥由 NAS 宿主的 alpine-router-deploy
# 在部署时注入，绝不进入公开 release 产物。

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "rootfs 发行版（三件套与 initrd 为发行版无关的共享资产）"
        type: choice
        required: true
        default: alpine
        options: [alpine, gentoo, all]

permissions:
  contents: write

env:
  ARCH: x86_64
  INFRA: base
  PACK: "1"
  HOSTNAME_VAL: alpine-router

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils file curl ca-certificates wget \
            cpio gzip squashfs-tools kmod e2fsprogs qemu-utils fakeroot nftables

      - name: Resolve distro list
        id: distros
        run: |
          if [ "${{ inputs.distro }}" = "all" ]; then
            echo 'list=["alpine","gentoo"]' >> "$GITHUB_OUTPUT"
          else
            echo "list=[\"${{ inputs.distro }}\"]" >> "$GITHUB_OUTPUT"
          fi

      - name: Build rootfs (base / x86_64)
        run: |
          set -euo pipefail
          for d in $(echo '${{ steps.distros.outputs.list }}' | jq -r '.[]'); do
            echo "=== 构建 $d rootfs ==="
            chmod +x "distros/$d/build.sh"
            sudo -E bash -x "distros/$d/build.sh"
          done

      - name: Locate + Assemble VM image (per distro)
        run: |
          set -euo pipefail
          chmod +x image/assemble.sh image/assemble-rootfs.sh
          rm -rf dist
          mkdir -p dist
          for d in $(echo '${{ steps.distros.outputs.list }}' | jq -r '.[]'); do
            echo "=== 装配 $d ==="
            f="$(ls -1 build/$d/$d-rootfs-minimal.tar.xz 2>/dev/null \
                 || ls -1 build/$d/*-rootfs-minimal.tar.* 2>/dev/null \
                 || ls -1 build/$d/*.tar.* 2>/dev/null | head -n1)"
            [ -n "${f:-}" ] && [ -e "$f" ] || { echo "未找到 $d 产物" >&2; ls -lR build/$d || true; exit 1; }
            bash image/assemble.sh "$f" "dist-$d" "$d"
            # 汇总到 dist/（vmlinuz/initrd 各次产物相同，取第一次即可）
            cp -n "dist-$d/vmlinuz-virt" "dist-$d/initrd" dist/ 2>/dev/null || true
            cp "dist-$d/$d-rootfs.qcow2" dist/
            cat "dist-$d/SHA256SUMS" >> dist/SHA256SUMS.tmp
          done
          sort -k2 dist/SHA256SUMS.tmp > dist/SHA256SUMS
          rm dist/SHA256SUMS.tmp
          ls -la dist/

      - name: Resolve tag
        id: tag
        run: echo "tag=microvm-router-vm-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Create / Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release 资产就位后，把 tag+sha256 同步进 nixos-modules/router.nix 并提交
      # （消费端升级只需 nix flake update）。幂等：同日重跑值不变则跳过提交。
      # push 不会循环触发本 workflow（仅 workflow_dispatch）。
      - name: Sync flake checksums
        run: |
          set -euo pipefail
          python3 image/sync-flake-sha.py \
            dist/SHA256SUMS nixos-modules/router.nix "${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "sha256 无变化（同日重复构建），跳过提交"
          else
            git add nixos-modules/router.nix
            git commit -m "ci: sync release checksums to ${{ steps.tag.outputs.tag }}"
            git push
            echo "flake checksums 已同步并推送"
          fi
