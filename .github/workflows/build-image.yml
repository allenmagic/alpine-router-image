name: router-image-build

# 手动触发：构建自建内核（与发行版无关，独立作业）+ 按发行版矩阵并行构建
# rootfs（musl-openrc 双发行版链）+ 装配可启动 VM 镜像
# → 汇总上传 release asset，并自动同步 flake 模块的 tag+sha256。
#
# 作业顺序：kernel → build（fan-in 内核的模块元数据）→ release
#
# 产物（tag: router-vm-YYYYMMDD）：
#   vmlinuz-router               自建内核（引导链全 builtin、无 initramfs，
#                                cloud-hypervisor 直接 --kernel 引导）
#   <distro>-rootfs.qcow2        VM 根磁盘（ro 挂载，guest 完全无状态）
#   config-router                自建内核的 .config（供查阅与复现，消费端不 fetch）
#   SHA256SUMS                   消费端 fetchurl 的 sha256 来源（多发行版条目）
#
# 内核与 rootfs 由同一 tag 一起发布、同批次绑定：内核 bump 必然重建配套 rootfs
# （模块元数据目录名随 uname -r 变化），故二者不解耦。
#
# 注：不使用 CI secrets 注入密钥——密钥由宿主 sops-nix 管理、router-vm-deploy
# 在部署时注入 guest /run，绝不进入公开 release 产物。

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "rootfs 发行版（vmlinuz-router 为发行版无关的共享资产）"
        type: choice
        required: true
        default: alpine
        options: [alpine, gentoo, all]

permissions:
  contents: write

env:
  ARCH: x86_64
  PACK: "1"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.distro }}" = "all" ]; then
            DISTROS='["alpine","gentoo"]'
          else
            DISTROS='["${{ inputs.distro }}"]'
          fi
          INCLUDE="["
          for D in $(echo "${DISTROS}" | jq -r '.[]'); do
            INCLUDE="${INCLUDE}{\"distro\":\"${D}\"},"
          done
          INCLUDE="${INCLUDE%,}]"
          echo "matrix={\"include\":${INCLUDE}}" >> "$GITHUB_OUTPUT"

  # 自建内核（消费端唯一内核）。与发行版无关，故独立成一个作业而不进
  # distro 矩阵——否则 alpine/gentoo 会各编一遍同样的内核。
  # 产物被下面的 build 作业 fan-in（注入 rootfs 的模块元数据）并进 release。
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make bc bison flex libelf-dev libssl-dev perl \
            xz-utils curl ca-certificates cpio gzip kmod

      # 缓存键含 KVER 与 config.fragment 的哈希：版本或配置一变即失效重编，
      # 否则会拿旧 .config 编出与片段不符的内核（静默丢能力）
      - name: Resolve cache key
        id: k
        run: |
          KVER="$(grep -oP '^KVER="\$\{KVER:-\K[^}]+' kernel/build.sh)"
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "frag=$(sha256sum kernel/config.fragment | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache kernel source + build tree
        uses: actions/cache@v4
        with:
          path: kernel/.cache
          key: kernel-${{ steps.k.outputs.kver }}-${{ steps.k.outputs.frag }}

      - name: Build kernel
        run: |
          set -euo pipefail
          chmod +x kernel/build.sh
          ./kernel/build.sh

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.run_id }}
          path: kernel/out/*
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [ prepare, kernel ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # 单一发行版失败不影响其他发行版
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: build-${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v6

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils file curl ca-certificates wget \
            cpio gzip squashfs-tools kmod e2fsprogs qemu-utils fakeroot nftables

      # 自建内核的模块元数据（~112K）要注入 rootfs，assemble.sh 默认从
      # kernel/out/modules 取。内核资产本身由 release 作业直接上传，不经此处。
      - name: Fetch kernel artifact
        uses: actions/download-artifact@v8
        with:
          name: kernel-${{ github.run_id }}
          path: kernel/out

      - name: Build rootfs (${{ matrix.distro }} / base / x86_64)
        env:
          # 宿主 hostname 按发行版区分（alpine-router / gentoo-router）
          HOSTNAME_VAL: ${{ matrix.distro }}-router
        run: |
          set -euo pipefail
          chmod +x "distros/${{ matrix.distro }}/build.sh"
          sudo -E bash -x "distros/${{ matrix.distro }}/build.sh"

      - name: Locate + Assemble VM image
        run: |
          set -euo pipefail
          chmod +x image/assemble.sh image/assemble-rootfs.sh
          d="${{ matrix.distro }}"
          f="$(ls -1 build/$d/$d-rootfs-minimal.tar.xz 2>/dev/null \
               || ls -1 build/$d/*-rootfs-minimal.tar.* 2>/dev/null \
               || ls -1 build/$d/*.tar.* 2>/dev/null | head -n1)"
          [ -n "${f:-}" ] && [ -e "$f" ] || { echo "未找到 $d 产物" >&2; ls -lR build/$d || true; exit 1; }
          bash image/assemble.sh "$f" dist "$d"
          # SHA256SUMS 按发行版命名，供 release job 合并（避免同名覆盖）
          mv dist/SHA256SUMS "dist/SHA256SUMS.$d"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          # artifact 名带 run_id：download 时按本次 run 精确匹配，
          # 避免 merge-multiple 混入 retention 期内的旧 run artifact
          # （曾导致 SHA256SUMS 出现跨构建重复条目）
          name: vm-image-${{ matrix.distro }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    # 显式含 kernel：本作业直接 download kernel artifact（虽然 build 已依赖它，
    # 传递依赖不体现在 needs.*.result 里，写出来才能表达真实的资产来源）
    needs: [ build, kernel ]
    if: ${{ always() && contains(needs.build.result, 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: vm-image-*-${{ github.run_id }}

      # 自建内核资产。放在独立目录再挑文件进 dist：内核 artifact 里还有
      # modules/ 元数据树（已注入 rootfs，不单独发布）与 vmlinux-router
      # （当前 CH 走 bzImage 路径不消费它，是将来切 PVH 的后路，不发布）。
      - name: Download kernel artifact
        uses: actions/download-artifact@v8
        with:
          name: kernel-${{ github.run_id }}
          path: kout

      - name: Merge SHA256SUMS
        run: |
          set -euo pipefail
          cp kout/vmlinuz-router kout/config-router dist/
          # 内核的 SHA256SUMS 只覆盖它自己的两个产物，与发行版的条目一起排序合并
          sort -k2 dist/SHA256SUMS.* kout/SHA256SUMS > dist/SHA256SUMS
          rm dist/SHA256SUMS.*
          echo "=== 汇总资产 ==="
          ls -la dist/
          echo "=== SHA256SUMS ==="
          cat dist/SHA256SUMS

      - name: Resolve tag
        id: tag
        run: echo "tag=router-vm-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Create / Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/vmlinuz-router
            dist/config-router
            dist/*-rootfs.qcow2
            dist/SHA256SUMS
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release 资产就位后，把 tag+sha256 同步进 nixos-modules/router-vm.nix
      # 并提交（消费端升级只需 nix flake update）。幂等：同日重跑值不变则跳过
      # 提交。push 不会循环触发本 workflow（仅 workflow_dispatch）。
      - name: Sync flake checksums
        run: |
          set -euo pipefail
          python3 image/sync-flake-sha.py \
            dist/SHA256SUMS nixos-modules/router-vm.nix "${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "sha256 无变化（同日重复构建），跳过提交"
          else
            git add nixos-modules/router-vm.nix
            git commit -m "ci: sync release checksums to ${{ steps.tag.outputs.tag }}"
            # 同日多次触发时远端可能有上一次的 sync 提交——rebase 后推送；
            # 冲突（同日两次构建的 sha256 不一致）时放弃推送，sync 失败不阻塞 job
            git pull --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push 2>/dev/null; then
              echo "flake checksums 已同步并推送"
            else
              echo "⚠️ checksums 推送被拒（远端并发变更），release 资产已就位，请手工同步"
            fi
          fi
