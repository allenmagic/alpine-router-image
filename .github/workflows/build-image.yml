name: microvm-router-build

# 手动触发：按发行版矩阵并行构建 rootfs（musl-openrc 双发行版链）
# + 装配可启动 VM 镜像（Alpine 官方 virt 三件套，发行版无关共享）
# → 汇总上传 release asset，并自动同步 flake 模块的 tag+sha256。
#
# 产物（tag: microvm-router-vm-YYYYMMDD）：
#   <distro>-rootfs.qcow2        VM 根磁盘（ext4 内含 rootfs + modloop 模块）
#   vmlinuz-virt / initrd        客户机内核与 initramfs（注入 ext4 依赖链，共享）
#   SHA256SUMS                   消费端 fetchurl 的 sha256 来源（多发行版条目）
#
# 注：不使用 CI secrets 注入密钥——密钥由 NAS 宿主的 alpine-router-deploy
# 在部署时注入，绝不进入公开 release 产物。

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "rootfs 发行版（三件套与 initrd 为发行版无关的共享资产）"
        type: choice
        required: true
        default: alpine
        options: [alpine, gentoo, all]

permissions:
  contents: write

env:
  ARCH: x86_64
  PACK: "1"
  HOSTNAME_VAL: alpine-router

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.distro }}" = "all" ]; then
            DISTROS='["alpine","gentoo"]'
          else
            DISTROS='["${{ inputs.distro }}"]'
          fi
          INCLUDE="["
          for D in $(echo "${DISTROS}" | jq -r '.[]'); do
            INCLUDE="${INCLUDE}{\"distro\":\"${D}\"},"
          done
          INCLUDE="${INCLUDE%,}]"
          echo "matrix={\"include\":${INCLUDE}}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # 单一发行版失败不影响其他发行版
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: build-${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v6

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils file curl ca-certificates wget \
            cpio gzip squashfs-tools kmod e2fsprogs qemu-utils fakeroot nftables

      - name: Build rootfs (${{ matrix.distro }} / base / x86_64)
        run: |
          set -euo pipefail
          chmod +x "distros/${{ matrix.distro }}/build.sh"
          sudo -E bash -x "distros/${{ matrix.distro }}/build.sh"

      - name: Locate + Assemble VM image
        run: |
          set -euo pipefail
          chmod +x image/assemble.sh image/assemble-rootfs.sh
          d="${{ matrix.distro }}"
          f="$(ls -1 build/$d/$d-rootfs-minimal.tar.xz 2>/dev/null \
               || ls -1 build/$d/*-rootfs-minimal.tar.* 2>/dev/null \
               || ls -1 build/$d/*.tar.* 2>/dev/null | head -n1)"
          [ -n "${f:-}" ] && [ -e "$f" ] || { echo "未找到 $d 产物" >&2; ls -lR build/$d || true; exit 1; }
          bash image/assemble.sh "$f" dist "$d"
          # SHA256SUMS 按发行版命名，供 release job 合并（避免同名覆盖）
          mv dist/SHA256SUMS "dist/SHA256SUMS.$d"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          # artifact 名带 run_id：download 时按本次 run 精确匹配，
          # 避免 merge-multiple 混入 retention 期内的旧 run artifact
          # （曾导致 SHA256SUMS 出现跨构建重复条目）
          name: vm-image-${{ matrix.distro }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: ${{ always() && contains(needs.build.result, 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: vm-image-*-${{ github.run_id }}

      - name: Merge SHA256SUMS
        run: |
          sort -k2 dist/SHA256SUMS.* > dist/SHA256SUMS
          rm dist/SHA256SUMS.*
          echo "=== 汇总资产 ==="
          ls -la dist/
          echo "=== SHA256SUMS ==="
          cat dist/SHA256SUMS

      - name: Resolve tag
        id: tag
        run: echo "tag=microvm-router-vm-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Create / Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/vmlinuz-virt
            dist/initrd
            dist/*-rootfs.qcow2
            dist/SHA256SUMS
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release 资产就位后，把 tag+sha256 同步进 nixos-modules/router.nix 并提交
      # （消费端升级只需 nix flake update）。幂等：同日重跑值不变则跳过提交。
      # push 不会循环触发本 workflow（仅 workflow_dispatch）。
      - name: Sync flake checksums
        run: |
          set -euo pipefail
          python3 image/sync-flake-sha.py \
            dist/SHA256SUMS nixos-modules/router.nix "${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "sha256 无变化（同日重复构建），跳过提交"
          else
            git add nixos-modules/router.nix
            git commit -m "ci: sync release checksums to ${{ steps.tag.outputs.tag }}"
            # 同日多次触发时远端可能有上一次的 sync 提交——rebase 后推送；
            # 冲突（同日两次构建的 sha256 不一致）时放弃推送，sync 失败不阻塞 job
            git pull --rebase origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push 2>/dev/null; then
              echo "flake checksums 已同步并推送"
            else
              echo "⚠️ checksums 推送被拒（远端并发变更），release 资产已就位，请手工同步"
            fi
          fi
