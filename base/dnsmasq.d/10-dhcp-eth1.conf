# ============================================================
# LAN 口 DHCP 地址池
# 占位符由 image 构建时替换（network.sh 按 network.env）
# ============================================================

# DHCP 地址池
dhcp-range=__LAN_IFACE__,__DHCP_RANGE_START__,__DHCP_RANGE_END__,__LAN_NETMASK__,__DHCP_LEASE_TIME__

# 网关 = 浮动 IP（VRRP 主备持有：yunshu 容器 MASTER / 本 VM BACKUP）
dhcp-option=__LAN_IFACE__,3,__LAN_GATEWAY__

# DNS 服务器 = VRRP 浮动地址。
# 正常时 yunshu 容器（MASTER）持有 __LAN_GATEWAY__ 并接管 DNS；
# 容器故障时 VRRP 切回本 VM，dnsmasq 以 bind-dynamic 监听该地址作为 fallback DNS。
dhcp-option=__LAN_IFACE__,6,__LAN_GATEWAY__

# 广播地址
dhcp-option=__LAN_IFACE__,28,__LAN_NETWORK__

# 注意：不配置 option 121（classless route）——RFC 3442 下支持 121 的
# 设备会优先采用 121 而忽略 option 3；若 121 指向 __LAN_IP__ 将绕过
# 浮动网关（yunshu 策略分流失效），与浮动网关设计冲突。

# DHCP 日志
log-dhcp
