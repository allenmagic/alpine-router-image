# host key 放到 /run/router-vm/ssh（tmpfs，每次启动重新生成）
#
# 不能靠 /etc/ssh/ssh_host_* 的符号链接：ssh-keygen 在目标同目录创建
# 临时文件（ssh_host_rsa_key.XXXXXXXXXX），ro rootfs 上必然失败
# （实测 "Could not save your private key ... Read-only file system"）。
# guest 无状态架构：key 由 sshd-keys 服务生成在 /run/router-vm/ssh/，
# 每次启动更换；deploy 通道用 root/root 密码 + StrictHostKeyChecking=no。
# 注：sshd_config 中一旦出现 HostKey 行，默认路径
# （/etc/ssh/ssh_host_*）即被整体替换，不会有双份 key。
HostKey /run/router-vm/ssh/ssh_host_rsa_key
HostKey /run/router-vm/ssh/ssh_host_ecdsa_key
HostKey /run/router-vm/ssh/ssh_host_ed25519_key
