# 浮动网关（VRRP）——BACKUP 节点（Alpine Router VM）
#
# 与 yunshu 容器（MASTER）组成主备浮动网关：
#   内网设备的 DHCP 网关 = 浮动 IP 192.168.10.254（永不变）
#   正常：yunshu 容器持有 .254（策略分流 + 透明代理）
#   容器不可用：本 VM 接管 .254（降级为纯直连 NAT，保连通优先）
#
# 参数与 yunshu-nix 的 gatewayConfig 对齐（vrid/auth_pass 两边必须一致）：
#   virtual_router_id = 10
#   auth_pass = alpine-float
# 修改浮动 IP 时同步：本文件 + network.env 的 LAN_GATEWAY + yunshu-nix
global_defs {
    # VM 场景无需邮件通知
}

vrrp_instance LAN {
    state BACKUP
    interface __LAN_IFACE__      # eth1（network.env 的 LAN_IFACE）
    virtual_router_id 10
    priority 100                # MASTER 侧 150，优先级低者待命
    advert_int 1
    nopreempt                   # 主恢复后不抢占（减少切换抖动）——BACKUP 侧配合

    authentication {
        auth_type PASS
        auth_pass alpine-float
    }

    virtual_ipaddress {
        192.168.10.254/24
    }
}
